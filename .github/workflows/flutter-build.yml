name: Flutter Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Quellcode auschecken
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Java für Android-Builds bereitstellen
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. Flutter Umgebung installieren
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        # Optional: flutter-version: '3.x.x'

    # 4. Abhängigkeiten herunterladen
    - name: Install dependencies
      run: flutter pub get

    # 5. App bauen (Beispiel: Android APK)
    - name: Build APK
      run: flutter build apk --release

    # 6. Fertige Datei in GitHub hochladen
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
